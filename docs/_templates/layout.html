{% extends "!layout.html" %}
{%- import "static/webpack-macros.html" as _webpack with context %}

{%- block css %}
  <script data-cfasync="false">
    (function() {
      var mode = localStorage.getItem("mode") || "{{ default_mode }}" || "auto";
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = localStorage.getItem("theme");
      if (theme !== "light" && theme !== "dark") {
        theme = (mode === "dark" || (mode === "auto" && prefersDark)) ? "dark" : "light";
      }
      document.documentElement.dataset.mode = mode;
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.bsTheme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <noscript>
    <style>
      .pst-js-only { display: none !important; }
    </style>
  </noscript>
  <style id="torax-critical-theme">
    :root,
    html,
    html:not([data-theme]),
    html[data-theme=""],
    html[data-theme="light"],
    [data-bs-theme="light"] {
      --torax-bg: #ffffff;
      --torax-fg: #111827;
      --torax-card: #ffffff;
      --torax-secondary: #f6f8fa;
      --torax-muted: #eef1f5;
      --torax-secondary-fg: color-mix(in srgb, var(--torax-fg) 76%, var(--torax-bg));
      --torax-muted-fg: color-mix(in srgb, var(--torax-fg) 56%, var(--torax-bg));
      --torax-border: #e5e7eb;
      --torax-code-bg: #f3f5f7;
      --torax-code-border: #e2e6eb;

      --pst-color-background: #ffffff !important;
      --pst-color-on-background: #ffffff !important;
      --pst-color-surface: #f6f8fa !important;
      --pst-color-on-surface: #111827 !important;
      --pst-color-text-base: #111827 !important;
      --pst-color-text-muted: var(--torax-muted-fg) !important;
      --pst-color-primary: #d1291f !important;
      --pst-color-primary-highlight: #a81e16 !important;
      --pst-color-secondary: #d1291f !important;
      --pst-color-secondary-highlight: #a81e16 !important;
      --pst-color-accent: #d1291f !important;
      --pst-color-link: #d1291f !important;
      --pst-color-link-hover: #a81e16 !important;
      --pst-color-link-higher-contrast: #d1291f !important;
      --pst-color-border: #e5e7eb !important;

      --bs-primary: #d1291f !important;
      --bs-primary-rgb: 209, 41, 31 !important;
      --bs-link-color: #d1291f !important;
      --bs-link-color-rgb: 209, 41, 31 !important;
      --bs-link-hover-color: #a81e16 !important;
      --bs-link-hover-color-rgb: 168, 30, 22 !important;

      --sd-color-primary: #d1291f !important;
      --sd-color-primary-highlight: #a81e16 !important;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]),
      html:not([data-theme="light"]) {
        --torax-bg: #373d3f;
        --torax-fg: #eef1f2;
        --torax-card: #3f4648;
        --torax-secondary: #444b4e;
        --torax-muted: #4c5457;
        --torax-secondary-fg: color-mix(in srgb, var(--torax-fg) 84%, var(--torax-bg));
        --torax-muted-fg: color-mix(in srgb, var(--torax-fg) 65%, var(--torax-bg));
        --torax-border: #4e5659;
        --torax-code-bg: #41484b;
        --torax-code-border: #525b5e;

        --pst-color-background: #373d3f !important;
        --pst-color-on-background: #3f4648 !important;
        --pst-color-surface: #444b4e !important;
        --pst-color-on-surface: #eef1f2 !important;
        --pst-color-text-base: #eef1f2 !important;
        --pst-color-text-muted: var(--torax-muted-fg) !important;
        --pst-color-primary: #de2e24 !important;
        --pst-color-primary-highlight: #ff5549 !important;
        --pst-color-secondary: #de2e24 !important;
        --pst-color-secondary-highlight: #ff5549 !important;
        --pst-color-accent: #de2e24 !important;
        --pst-color-link: #de2e24 !important;
        --pst-color-link-hover: #ff5549 !important;
        --pst-color-link-higher-contrast: #de2e24 !important;
        --pst-color-border: #4e5659 !important;

        --bs-primary: #de2e24 !important;
        --bs-primary-rgb: 222, 46, 36 !important;
        --bs-link-color: #de2e24 !important;
        --bs-link-color-rgb: 222, 46, 36 !important;
        --bs-link-hover-color: #ff5549 !important;
        --bs-link-hover-color-rgb: 255, 85, 73 !important;

        --sd-color-primary: #de2e24 !important;
        --sd-color-primary-highlight: #ff5549 !important;
      }
    }

    html[data-theme="dark"],
    [data-bs-theme="dark"] {
      --torax-bg: #373d3f;
      --torax-fg: #eef1f2;
      --torax-card: #3f4648;
      --torax-secondary: #444b4e;
      --torax-muted: #4c5457;
      --torax-secondary-fg: color-mix(in srgb, var(--torax-fg) 84%, var(--torax-bg));
      --torax-muted-fg: color-mix(in srgb, var(--torax-fg) 65%, var(--torax-bg));
      --torax-border: #4e5659;
      --torax-code-bg: #41484b;
      --torax-code-border: #525b5e;

      --pst-color-background: #373d3f !important;
      --pst-color-on-background: #3f4648 !important;
      --pst-color-surface: #444b4e !important;
      --pst-color-on-surface: #eef1f2 !important;
      --pst-color-text-base: #eef1f2 !important;
      --pst-color-text-muted: var(--torax-muted-fg) !important;
      --pst-color-primary: #de2e24 !important;
      --pst-color-primary-highlight: #ff5549 !important;
      --pst-color-secondary: #de2e24 !important;
      --pst-color-secondary-highlight: #ff5549 !important;
      --pst-color-accent: #de2e24 !important;
      --pst-color-link: #de2e24 !important;
      --pst-color-link-hover: #ff5549 !important;
      --pst-color-link-higher-contrast: #de2e24 !important;
      --pst-color-border: #4e5659 !important;

      --bs-primary: #de2e24 !important;
      --bs-primary-rgb: 222, 46, 36 !important;
      --bs-link-color: #de2e24 !important;
      --bs-link-color-rgb: 222, 46, 36 !important;
      --bs-link-hover-color: #ff5549 !important;
      --bs-link-hover-color-rgb: 255, 85, 73 !important;

      --sd-color-primary: #de2e24 !important;
      --sd-color-primary-highlight: #ff5549 !important;
    }

    html, body {
      background-color: var(--pst-color-background);
      color: var(--pst-color-text-base);
    }

    a, a:link, a:visited {
      color: var(--pst-color-link);
    }

    a:hover, a:focus, a:active, a:visited:hover {
      color: var(--pst-color-link-hover);
    }
  </style>
  {{ _webpack.head_pre_assets() }}
  {{- css() }}
  <style id="torax-critical-links">
    a, a:link, a:visited {
      color: var(--pst-color-link);
    }
    a:hover, a:focus, a:active, a:visited:hover {
      color: var(--pst-color-link-hover);
    }
    nav.bd-links li > a,
    .toc-entry a.nav-link {
      color: var(--torax-secondary-fg);
    }
    nav.bd-links a.current,
    nav.bd-links li.active > a,
    nav.bd-links li > a:hover,
    nav.bd-links li > a:focus,
    nav.bd-links li > a:active,
    .toc-entry a.nav-link.active,
    .toc-entry a.nav-link[aria-current="true"],
    .toc-entry a.nav-link:hover,
    .toc-entry a.nav-link:focus,
    .toc-entry a.nav-link:active {
      color: var(--pst-color-primary);
    }
  </style>
  <script data-cfasync="false">
    (function() {
      function flashTarget(hash) {
        if (!hash || hash.length < 2) return;
        var id;
        try { id = decodeURIComponent(hash.slice(1)); } catch (e) { id = hash.slice(1); }
        var raw = document.getElementById(id);
        if (!raw) return;
        var el = raw.tagName === "SECTION"
          ? (raw.querySelector(":scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6") || raw)
          : raw;
        el.classList.remove("torax-jump-flash");
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
        el.classList.add("torax-jump-flash");
      }
      document.addEventListener("click", function(e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href*="#"]') : null;
        if (!a) return;
        var url;
        try { url = new URL(a.href, window.location.href); } catch (err) { return; }
        if (url.origin === window.location.origin && url.pathname === window.location.pathname && url.hash) {
          requestAnimationFrame(function() { flashTarget(url.hash); });
        }
      });
    })();
  </script>
  {{ _webpack.head_js_preload() }}
{%- endblock css %}
